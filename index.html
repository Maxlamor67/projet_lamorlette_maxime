<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire d'inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Formulaire d'inscription -->
  <div class="container" id="form-container">
    <h1>Créer un compte</h1>

    <form id="signup-form">
      <div class="form-group">
        <label for="login">Login</label>
        <input type="text" id="login" name="login" required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmation du mot de passe</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
      </div>

      <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>
      </div>

      <div class="form-group">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" required>
      </div>

      <div class="form-group">
        <label for="adresse">Adresse</label>
        <input type="text" id="adresse" name="adresse" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input type="text" id="telephone" name="telephone" required>
        <span id="telephone-error" class="field-error"></span>
      </div>

      <div class="form-group">
        <label for="date-naissance">Date de naissance</label>
        <input type="date" id="date-naissance" name="date-naissance" required>
      </div>

      <p id="error-message" class="error-message"></p>

      <button type="submit">S'inscrire</button>
    </form>
  </div>

  <div class="container hidden" id="recap-container">
    <h1>Récapitulatif de votre inscription</h1>

    <ul id="recap-list">
      <!-- Les informations seront ajoutées ici en JavaScript -->
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
